<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teximo — Career & Placement Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="brand fs-2">Tex<span>imo</span></div>
        <div class="text-muted">AI-powered career &amp; placement platform</div>
      </div>

      <ul class="nav nav-pills nav-fill mb-4" id="portalTabs">
        <li class="nav-item"><button class="nav-link active" data-portal="STUDENT" type="button">Student Login</button></li>
        <li class="nav-item"><button class="nav-link" data-portal="ADMIN" type="button">Admin Login</button></li>
      </ul>

      <div id="alertBox" class="alert alert-danger d-none py-2"></div>

      <!-- Login form (used by both portals) -->
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" id="email" type="email" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-amber w-100 py-2" type="submit" id="loginBtn">Log in</button>
      </form>

      <!-- Student registration (students only; admin accounts are created by the system owner) -->
      <form id="registerForm" class="d-none" novalidate>
        <div class="mb-3"><label class="form-label" for="rName">Full name</label>
          <input class="form-control" id="rName" autocomplete="name" required></div>
        <div class="mb-3"><label class="form-label" for="rEmail">Email</label>
          <input class="form-control" id="rEmail" type="email" autocomplete="email" required></div>
        <div class="row g-2 mb-3">
          <div class="col"><label class="form-label" for="rCollege">College</label><input class="form-control" id="rCollege"></div>
          <div class="col"><label class="form-label" for="rBranch">Branch</label><input class="form-control" id="rBranch" placeholder="e.g. CSE"></div>
        </div>
        <div class="mb-3"><label class="form-label" for="rPassword">Password <small class="text-muted">(min 8 characters)</small></label>
          <input class="form-control" id="rPassword" type="password" autocomplete="new-password" minlength="8" required></div>
        <button class="btn btn-amber w-100 py-2" type="submit" id="registerBtn">Create student account</button>
      </form>

      <div class="text-center mt-3" id="switchRow">
        <span id="switchText" class="text-muted">New student?</span>
        <a href="#" id="switchLink">Register here</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
