<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teximo — Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Tex<span>imo</span></div>
    <nav class="nav flex-column menu" id="menu">
      <a class="nav-link active" data-view="dashboard">🏠 Dashboard</a>
      <a class="nav-link" data-view="profile">👤 My Profile</a>
      <a class="nav-link" data-view="jobs">💼 Jobs &amp; Internships</a>
      <a class="nav-link" data-view="drives">🏫 Placement Drives</a>
      <a class="nav-link" data-view="applications">📋 My Applications</a>
      <a class="nav-link" data-view="resume">📄 Resume Studio</a>
      <a class="nav-link" data-view="notifications">🔔 Notifications <span class="badge text-bg-warning ms-auto d-none" id="notifCount"></span></a>
      <a class="nav-link" data-view="complaints">🛠 Report a Problem</a>
    </nav>
    <div class="user-box">
      <div class="fw-semibold text-white" id="who"></div>
      <a href="#" class="text-warning small" id="logout">Log out</a>
    </div>
  </aside>
  <main class="content" id="view"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/student.js"></script>
<script src="js/chatbot.js"></script>
</body>
</html>
