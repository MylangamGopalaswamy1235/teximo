server.port=8080

# Database: read from environment variables (never hard-code credentials)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/teximo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Resume uploads (PDF up to 500 MB)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Security
# TEXIMO_MASTER_KEY encrypts saved API keys (any long random string).
teximo.master-key=${TEXIMO_MASTER_KEY:change-me-to-a-long-random-string}
teximo.token-secret=${TEXIMO_TOKEN_SECRET:change-me-too-another-long-random-string}
teximo.secrets-file=${TEXIMO_SECRETS_FILE:./data/secrets.enc}
teximo.allowed-origin=${TEXIMO_ALLOWED_ORIGIN:*}

# Optional: first admin account created on startup if no admin exists
teximo.admin.email=${ADMIN_EMAIL:admin@teximo.local}
teximo.admin.password=${ADMIN_PASSWORD:Admin@12345}
